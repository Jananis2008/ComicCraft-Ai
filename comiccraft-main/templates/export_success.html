<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ app_name }} - Export
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

<div class="container">

    <section class="success-card">

        <div class="success-icon">
            ✅
        </div>

        <h1>
            Comic Exported Successfully
        </h1>

        <p>
            Your comic PDF is ready.
        </p>


        <a
            href="/export/{{ job_id }}"
            class="download-btn"
        >
            📄 Download PDF
        </a>


        <a
            href="/"
            class="back-btn"
        >
            ← Create Another Comic
        </a>

    </section>

</div>

</body>
</html>
